name: Build Artifacts

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental == true }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: macros-windows-x86_64.exe
            experimental: false

          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: macros-linux-x86_64
            linux_arch: x86_64
            experimental: false

          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: macros-linux-arm64
            linux_arch: aarch64
            experimental: false

          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            artifact_name: macros-macos-arm64
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libdbus-1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libx11-dev \
            libxtst-dev \
            libwayland-dev \
            wayland-protocols \
            libclang-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Build (release)
        if: runner.os != 'macOS'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (Linux)
        if: runner.os == 'Linux'
        run: cp target/${{ matrix.target }}/release/macros ${{ matrix.artifact_name }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item target/${{ matrix.target }}/release/macros.exe ${{ matrix.artifact_name }}

      - name: Upload artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Locate or install Inno Setup
        if: matrix.name == 'windows-x86_64'
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y
          }

      - name: Build installer (Inno Setup)
        if: matrix.name == 'windows-x86_64'
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $version = "${{ github.sha }}".Substring(0, 7)
          & $iscc "/DMyAppVersion=$version-dev" installer\macros.iss

      - name: Upload installer artifact
        if: matrix.name == 'windows-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: macros-windows-x86_64-setup.exe
          path: dist/macros-windows-x86_64-setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Build macOS app bundle
        if: runner.os == 'macOS'
        run: ./scripts/build-macos-bundle.sh ${{ matrix.target }}

      - name: Zip macOS app bundle
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/Macros.app ${{ matrix.artifact_name }}.app.zip

      - name: Upload macOS app bundle
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}.app.zip
          path: ${{ matrix.artifact_name }}.app.zip
          if-no-files-found: error
          retention-days: 14

      - name: Build AppImage
        if: runner.os == 'Linux'
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          wget -q -O linuxdeploy.AppImage "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.linux_arch }}.AppImage"
          wget -q -O linuxdeploy-plugin-appimage.AppImage "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-${{ matrix.linux_arch }}.AppImage"
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-appimage.AppImage
          # linuxdeploy expects the binary name to match the Exec entry in the desktop file
          cp ${{ matrix.artifact_name }} macros

          # cef-dll-sys' build script drops the whole CEF runtime (libcef.so, GL/Vulkan
          # shims, *.pak, icudtl.dat, locales/, ...) next to the compiled binary in
          # target/<triple>/release. libcef.so has to sit beside `macros` for linuxdeploy
          # to resolve the NEEDED entry via ldd; the rest of the payload isn't linked
          # (some is dlopen'd, the data files aren't ELF at all), so it has to be copied
          # in by hand wherever libcef.so ends up (usr/lib, once linuxdeploy deploys it).
          CEF_DIR="target/${{ matrix.target }}/release"
          cp "$CEF_DIR/libcef.so" .

          ./linuxdeploy.AppImage \
            --appdir AppDir \
            --executable ./macros \
            --desktop-file res/macros.desktop \
            --icon-file res/icons/macros.png

          cp "$CEF_DIR"/libEGL.so "$CEF_DIR"/libGLESv2.so "$CEF_DIR"/libvk_swiftshader.so \
             "$CEF_DIR"/libvulkan.so.1 "$CEF_DIR"/vk_swiftshader_icd.json "$CEF_DIR"/chrome-sandbox \
             "$CEF_DIR"/icudtl.dat "$CEF_DIR"/v8_context_snapshot.bin "$CEF_DIR"/chrome_100_percent.pak \
             "$CEF_DIR"/chrome_200_percent.pak "$CEF_DIR"/resources.pak \
             AppDir/usr/lib/
          cp -r "$CEF_DIR/locales" AppDir/usr/lib/

          ./linuxdeploy.AppImage --appdir AppDir --output appimage
          mv Macros*.AppImage ${{ matrix.artifact_name }}.AppImage

      - name: Upload AppImage artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}.AppImage
          path: ${{ matrix.artifact_name }}.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Install Flatpak tooling
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          # org.gnome.Platform, not org.freedesktop.Platform: tao/wry need GTK3 for the
          # window itself, which the freedesktop runtime doesn't ship.
          flatpak install --user --noninteractive flathub org.gnome.Platform//50 org.gnome.Sdk//50

      - name: Build Flatpak
        if: runner.os == 'Linux'
        run: |
          cp ${{ matrix.artifact_name }} packaging/flatpak/macros

          # Same CEF runtime payload as the AppImage step above, staged for the
          # manifest's sources list (packaging/flatpak/dev.ethanstokes.Macros.yml).
          CEF_DIR="target/${{ matrix.target }}/release"
          cp "$CEF_DIR"/libcef.so "$CEF_DIR"/libEGL.so "$CEF_DIR"/libGLESv2.so \
             "$CEF_DIR"/libvk_swiftshader.so "$CEF_DIR"/libvulkan.so.1 "$CEF_DIR"/vk_swiftshader_icd.json \
             "$CEF_DIR"/chrome-sandbox "$CEF_DIR"/icudtl.dat "$CEF_DIR"/v8_context_snapshot.bin \
             "$CEF_DIR"/chrome_100_percent.pak "$CEF_DIR"/chrome_200_percent.pak "$CEF_DIR"/resources.pak \
             packaging/flatpak/
          cp -r "$CEF_DIR/locales" packaging/flatpak/locales

          flatpak-builder --force-clean --user --repo=flatpak-repo flatpak-build packaging/flatpak/dev.ethanstokes.Macros.yml
          flatpak build-bundle flatpak-repo ${{ matrix.artifact_name }}.flatpak dev.ethanstokes.Macros stable

      - name: Upload Flatpak artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}.flatpak
          path: ${{ matrix.artifact_name }}.flatpak
          if-no-files-found: error
          retention-days: 14
