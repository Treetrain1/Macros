name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. 0.3.1)"
        required: true
        type: string
      release_name:
        description: "Release title (leave blank to use tag as title)"
        required: false
        type: string
        default: ""

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental == true }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: macros-windows-x86_64.exe
            experimental: false

          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: macros-linux-x86_64
            linux_arch: x86_64
            experimental: false

          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: macros-linux-arm64
            linux_arch: aarch64
            experimental: false

          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            artifact_name: macros-macos-arm64
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libdbus-1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libx11-dev \
            libxtst-dev \
            libwayland-dev \
            wayland-protocols \
            libclang-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/macros ${{ matrix.artifact_name }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item target/${{ matrix.target }}/release/macros.exe ${{ matrix.artifact_name }}

      - name: Upload artifact
        if: runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 90

      - name: Build AppImage
        if: runner.os == 'Linux'
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          wget -q -O linuxdeploy.AppImage "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.linux_arch }}.AppImage"
          wget -q -O linuxdeploy-plugin-appimage.AppImage "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-${{ matrix.linux_arch }}.AppImage"
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-appimage.AppImage
          # linuxdeploy expects the binary name to match the Exec entry in the desktop file
          cp ${{ matrix.artifact_name }} macros
          ./linuxdeploy.AppImage \
            --appdir AppDir \
            --executable ./macros \
            --desktop-file res/macros.desktop \
            --icon-file res/icons/macros.png \
            --output appimage
          mv Macros*.AppImage ${{ matrix.artifact_name }}.AppImage

      - name: Upload AppImage artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}.AppImage
          path: ${{ matrix.artifact_name }}.AppImage
          if-no-files-found: error
          retention-days: 90

      - name: Install Flatpak tooling
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: Build Flatpak
        if: runner.os == 'Linux'
        run: |
          cp ${{ matrix.artifact_name }} packaging/flatpak/macros
          flatpak-builder --force-clean --user --repo=flatpak-repo flatpak-build packaging/flatpak/dev.ethanstokes.Macros.yml
          flatpak build-bundle flatpak-repo ${{ matrix.artifact_name }}.flatpak dev.ethanstokes.Macros stable

      - name: Upload Flatpak artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}.flatpak
          path: ${{ matrix.artifact_name }}.flatpak
          if-no-files-found: error
          retention-days: 90

      - name: Locate or install Inno Setup
        if: matrix.name == 'windows-x86_64'
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y
          }

      - name: Determine installer version
        if: matrix.name == 'windows-x86_64'
        id: installer_version
        shell: pwsh
        run: |
          $tag = "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          $version = $tag -replace '^v', ''
          echo "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build installer (Inno Setup)
        if: matrix.name == 'windows-x86_64'
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.installer_version.outputs.value }}" installer\macros.iss

      - name: Upload installer artifact
        if: matrix.name == 'windows-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: macros-windows-x86_64-setup.exe
          path: dist/macros-windows-x86_64-setup.exe
          if-no-files-found: error
          retention-days: 90

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: always()
    permissions:
      contents: write

    steps:
      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine release name
        id: release_name
        run: |
          NAME="${{ inputs.release_name }}"
          if [ -z "$NAME" ]; then
            NAME="${{ steps.tag.outputs.value }}"
          fi
          echo "value=$NAME" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: ./release-artifacts

      - name: List release artifacts
        run: ls -lh ./release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: ${{ steps.release_name.outputs.value }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: ./release-artifacts/*
          body: |
            ## Downloads

            | Platform | File |
            |---|---|
            | Windows x86_64 (installer) | `macros-windows-x86_64-setup.exe` |
            | Windows x86_64 (portable exe) | `macros-windows-x86_64.exe` |
            | Linux x86_64 (AppImage) | `macros-linux-x86_64.AppImage` |
            | Linux x86_64 (Flatpak) | `macros-linux-x86_64.flatpak` |
            | Linux arm64 (AppImage) | `macros-linux-arm64.AppImage` |
            | Linux arm64 (Flatpak) | `macros-linux-arm64.flatpak` |
