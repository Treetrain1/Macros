[workspace]
members = ["src-tauri", "macros-core", "macros-ffi", "macros-linux-bridge"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2024"

[workspace.dependencies]
tauri = { git = "https://github.com/EthanRStokes/tauri", rev = "8e422e5951769be66102e0481351f702f65c55d8" }
tracing = "0.1.44"
tracing-log = "0.2.0"
tracing-subscriber = "0.3.23"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
dirs = "6.0.0"
uuid = { version = "1.24.0", features = ["v4"] }
rand = "0.10.2"
slotmap = { version = "1.1.1", features = ["serde"] }
tokio = { version = "1.53.0", features = ["sync"] }
spin_sleep = "1.3.3"
rfd = "0.17.2"
libc = "0.2"
evdev = "0.13.2"
bincode = { version = "2", features = ["serde"] }
memmap2 = "0.9"
windows-sys = { version = "0.61.2", features = [
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_Security",
] }
enigo = "0.6.1"
self_update = { version = "0.44", default-features = false, features = ["reqwest", "rustls"] }
http = "1"
core-graphics = "0.25.0"
core-foundation = "0.10.1"
foreign-types = "0.5"
tauri-build = { git = "https://github.com/EthanRStokes/tauri", rev = "8e422e5951769be66102e0481351f702f65c55d8", features = [] }
tauri-runtime-cef = { git = "https://github.com/EthanRStokes/tauri", rev = "8e422e5951769be66102e0481351f702f65c55d8", default-features = false }
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7.0", features = ["cors"] }
