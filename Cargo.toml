[workspace]
members = ["src-tauri"]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2024"

[workspace.dependencies]
tauri = { git = "https://github.com/tauri-apps/tauri", tag = "tauri-cef-v3.0.0-alpha.19", features = ["cef"] }
tracing = "0.1.44"
tracing-log = "0.2.0"
tracing-subscriber = "0.3.23"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
dirs = "6.0.0"
uuid = { version = "1.24.0", features = ["v4"] }
rand = "0.10.2"
slotmap = { version = "1.1.1", features = ["serde"] }
tokio = { version = "1.52.4", features = ["rt", "rt-multi-thread", "macros", "sync", "net", "io-util", "time"] }
spin_sleep = "1.3.3"
rfd = "0.17.2"
libc = "0.2"
evdev = "0.13.2"
windows-sys = { version = "0.61.2", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
enigo = "0.6.1"
self_update = { version = "0.44", default-features = false, features = ["reqwest", "rustls"] }
http = "1"
core-graphics = "0.23"
core-foundation = "0.9"
foreign-types = "0.5"
tauri-build = { git = "https://github.com/tauri-apps/tauri", tag = "tauri-cef-v3.0.0-alpha.19", features = [] }
