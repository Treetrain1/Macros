[package]
name = "macros"
version = "0.1.0"
edition = "2024"

[dependencies]
tracing = "0.1.41"
tracing-log = "0.2.0"
tracing-subscriber = "0.3.23"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
dirs = "6.0.0"
uuid = { version = "1.18.1", features = ["v4"] }
rand = "0.10.1"
slotmap = { version = "1.0.7", features = ["serde"] }
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros"] }
rdev = { version = "0.5.3", features = ["unstable_grab"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "f0f6893"
version = "1.0.0"
default-features = false

[target.'cfg(windows)'.dependencies]
enigo = {
    git = "https://github.com/enigo-rs/enigo.git",
    rev = "6f311ea",
    features = ["serde"]
}
libcosmic = {
    git = "https://github.com/pop-os/libcosmic.git",
    rev = "f0f6893",
    version = "1.0.0",
    default-features = false,
    features = [
        #"debug",
        "winit",
        "tokio",
        "multi-window",
        "serde-keycode"
    ]
}

[target.'cfg(target_os = "linux")'.dependencies]
enigo = {
    git = "https://github.com/enigo-rs/enigo.git",
    rev = "6f311ea",
    features = ["serde", "x11rb", "wayland"]
}
libcosmic = {
    git = "https://github.com/pop-os/libcosmic.git",
    rev = "f0f6893",
    version = "1.0.0",
    default-features = false,
    features = [
        #"debug",
        "winit",
        "tokio",
        "xdg-portal",
        "dbus-config",
        "a11y",
        "multi-window",
        "serde-keycode"
    ]
}

[build-dependencies]
