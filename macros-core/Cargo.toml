[package]
name = "macros-core"
version.workspace = true
edition.workspace = true

[lib]
name = "macros_core"

[features]
default = ["ipc", "updater"]
# Loopback TCP control server; not needed by an embedder (e.g. the Geode
# mod) that calls into this crate directly and in-process.
ipc = ["tokio/rt", "tokio/rt-multi-thread", "tokio/macros", "tokio/net", "tokio/io-util", "tokio/time"]
# Self-update mechanism for the standalone desktop app; inappropriate for a
# copy of this crate embedded inside another process (e.g. a game).
updater = ["dep:self_update", "dep:http"]

[dependencies]
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
uuid.workspace = true
rand.workspace = true
tokio.workspace = true
spin_sleep.workspace = true
bincode.workspace = true
starship-battery.workspace = true
chrono.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
evdev.workspace = true
# XTest-based emission backend (see backend/xtest.rs): injects directly into
# the X server, skipping the kernel evdev/libinput/compositor hops the
# uinput-based EvdevBackend's emission goes through - the extra hops there
# turned out to add just enough latency to throw off frame/tick-precise
# input under Wine (confirmed: GD runs a fixed 240 TPS independent of
# render rate, so it wasn't a framerate mismatch; scheduling priority was
# separately confirmed to already be real SCHED_FIFO, not the emulated one
# Wine gives Windows-side threads - process of elimination points at this
# pipeline). Already a workspace dependency for the Windows backend
# (`backend/windows.rs`); its default `x11rb` feature covers XTest here too.
enigo.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
enigo.workspace = true
self_update = { workspace = true, optional = true }
http = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics.workspace = true
core-foundation.workspace = true
foreign-types.workspace = true
