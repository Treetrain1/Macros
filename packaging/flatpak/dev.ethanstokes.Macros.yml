app-id: dev.ethanstokes.Macros
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: macros
branch: stable

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=x11
  - --device=all
  - --device=dri
  - --talk-name=org.freedesktop.DBus
  - --filesystem=home

modules:
  - name: macros
    buildsystem: simple
    build-commands:
      - install -Dm755 macros /app/bin/macros
      - install -Dm644 macros.desktop /app/share/applications/dev.ethanstokes.Macros.desktop
      - install -Dm644 macros.png /app/share/icons/hicolor/256x256/apps/dev.ethanstokes.Macros.png
    sources:
      - type: file
        path: macros
      - type: file
        path: ../../res/macros.desktop
      - type: file
        path: ../../res/icons/macros.png
