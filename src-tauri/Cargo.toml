[package]
name = "macros"
version = "0.3.1"
edition = "2024"

[lib]
name = "macros"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { git = "https://github.com/tauri-apps/tauri", tag = "tauri-cef-v3.0.0-alpha.16", features = ["cef"] }
tracing = "0.1.41"
tracing-log = "0.2.0"
tracing-subscriber = "0.3.23"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
dirs = "6.0.0"
uuid = { version = "1.18.1", features = ["v4"] }
rand = "0.10.1"
slotmap = { version = "1.0.7", features = ["serde"] }
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros", "sync", "net", "io-util", "time"] }
spin_sleep = "1.3.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
enigo = "0.6"
self_update = { version = "0.44", default-features = false, features = ["reqwest", "rustls"] }
http = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
core-foundation = "0.9"
foreign-types = "0.5"

[build-dependencies]
tauri-build = { git = "https://github.com/tauri-apps/tauri", tag = "tauri-cef-v3.0.0-alpha.16", features = [] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"
