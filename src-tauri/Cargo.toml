[package]
name = "macros"
version.workspace = true
edition.workspace = true

[lib]
name = "macros"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
macros-core = { path = "../macros-core" }
tauri.workspace = true
tauri-runtime-cef.workspace = true
tracing.workspace = true
tracing-log.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio.workspace = true
rfd.workspace = true
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }

[features]
default = ["cef"]
cef = ["tauri/cef"]
# Debug-only HTTP+WebSocket bridge that lets a plain browser tab (no Tauri
# webview) drive the real running backend — see src/dev_bridge.rs.
dev-bridge = ["dep:axum", "dep:tower-http"]

[build-dependencies]
tauri-build.workspace = true
