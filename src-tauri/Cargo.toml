[package]
name = "macros"
version.workspace = true
edition.workspace = true

[lib]
name = "macros"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri.workspace = true
tracing.workspace = true
tracing-log.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
uuid.workspace = true
rand.workspace = true
slotmap.workspace = true
tokio.workspace = true
spin_sleep.workspace = true
rfd.workspace = true
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }

[features]
default = ["cef"]
# Mirrors the `cef` feature already force-enabled on the `tauri` workspace
# dependency. `cargo tauri dev`'s macOS bundler only takes the CEF code path
# (building a real .app so CEF can find its Frameworks dir) when it sees this
# feature declared and enabled on this package's own manifest.
cef = ["tauri/cef"]
# Debug-only HTTP+WebSocket bridge that lets a plain browser tab (no Tauri
# webview) drive the real running backend — see src/dev_bridge.rs.
dev-bridge = ["dep:axum", "dep:tower-http"]

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
evdev.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
enigo.workspace = true
self_update.workspace = true
http.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics.workspace = true
core-foundation.workspace = true
foreign-types.workspace = true

[build-dependencies]
tauri-build.workspace = true
