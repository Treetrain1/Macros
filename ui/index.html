<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width">
  <title>Macros</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('macros-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div id="app"></div>
<div id="dd-portal"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
