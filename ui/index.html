<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width">
  <title>Macros</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══ Main Page ═══════════════════════════════════════════════════════════ -->
<div id="main-page">

  <!-- Row 1: Macro Selector -->
  <div class="toolbar-row" id="selector-row">
    <div class="selector-left">
      <label for="macro-dropdown">Select macro</label>
      <select id="macro-dropdown"></select>
    </div>
    <div class="selector-right">
      <button id="new-macro-btn" title="Add a new macro">＋ New macro</button>
      <button id="remove-macro-btn" title="Delete selected macro">✕ Remove</button>
      <button id="settings-btn" title="Open Settings">⚙ Settings</button>
    </div>
  </div>

  <!-- Row 2: Run Controls -->
  <div class="toolbar-row" id="run-row">
    <div class="run-left">
      <button id="run-macro-btn" title="Runs the current macro once or starts looping if enabled">
        ▶ Run macro
      </button>
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
        <input type="checkbox" id="loop-mode-check">
        Loop mode
      </label>
    </div>
    <div class="run-right">
      <button id="record-btn" class="btn-record" title="Record keyboard and mouse events into the macro">
        ⏺ Record
      </button>
    </div>
  </div>

  <!-- Row 3: Macro Editor (hidden when no macro selected) -->
  <div id="macro-editor" class="hidden">
    <div class="editor-title-row">
      <label for="macro-title">Title</label>
      <input type="text" id="macro-title" placeholder="Macro name">
    </div>

    <div class="instructions-scroll" id="instructions-scroll">
      <div class="instructions-inner" id="instructions-inner"></div>
    </div>

    <div class="add-instruction-row">
      <label style="font-size:12px;color:var(--text-dim);white-space:nowrap;">Add at end:</label>
      <select id="add-instruction-type">
        <option value="Wait">Wait</option>
        <option value="Text">Text</option>
        <option value="Key">Key</option>
        <option value="Button">Mouse Button</option>
        <option value="MoveMouse">Move Mouse</option>
        <option value="Scroll">Scroll</option>
        <option value="Command">Command</option>
        <option value="Comment">Comment</option>
      </select>
      <button id="add-instruction-btn">Add</button>
    </div>

    <div class="editor-toolbar">
      <button id="undo-btn" title="Undo last instruction change">↩ Undo</button>
      <button id="redo-btn" title="Redo last undone change">↪ Redo</button>
      <button id="clear-instructions-btn" title="Remove all instructions">✕ Clear instructions</button>
      <button id="save-macro-btn" title="Save macro to disk">💾 Save macro</button>
    </div>
  </div>

</div>

<!-- ═══ Settings Page ═══════════════════════════════════════════════════════ -->
<div id="settings-page" class="hidden">
  <div class="settings-header">
    <button id="back-btn">← Back</button>
    <span style="font-weight:600;">Settings</span>
  </div>
  <div class="settings-scroll">
    <div id="warnings-container"></div>

    <!-- Global Hotkeys -->
    <div class="settings-section">
      <div class="settings-section-title">Global Hotkeys</div>
      <div id="global-hotkeys-list"></div>
    </div>

    <!-- Per-Macro Hotkeys -->
    <div class="settings-section">
      <div class="settings-section-title">Per-Macro Hotkeys</div>
      <div id="per-macro-hotkeys-list"></div>
      <div class="settings-row" id="add-hotkey-form">
        <div class="settings-row-label">Add hotkey:</div>
        <select id="pending-macro-select"><option value="">Select macro…</option></select>
        <button id="pending-combo-btn">Set combo</button>
        <button id="add-macro-hotkey-btn">＋ Add</button>
      </div>
    </div>

    <!-- TCP Server -->
    <div class="settings-section">
      <div class="settings-section-title">TCP Server</div>
      <div id="tcp-server-section"></div>
    </div>

    <!-- Updates (rendered always, hidden by JS if no update info) -->
    <div class="settings-section" id="updates-section">
      <div class="settings-section-title">Updates</div>
      <div id="updates-content"></div>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
