<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width">
  <title>Macros</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('macros-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
</head>
<body>

<!-- ═══ Main Page ═══════════════════════════════════════════════════════════ -->
<div id="main-page">

  <!-- Row 1: Macro Selector -->
  <div class="toolbar-row" id="selector-row">
    <div class="selector-left">
      <label id="macro-dropdown-label">Select macro</label>
      <div id="macro-dropdown-container"></div>
    </div>
    <div class="selector-right">
      <button id="new-macro-btn" title="Add a new macro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg><span>New macro</span></button>
      <button id="remove-macro-btn" class="btn-danger" title="Delete selected macro"></button>
      <button id="settings-btn" title="Open Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"></path><circle cx="12" cy="12" r="3"></circle></svg><span>Settings</span></button>
    </div>
  </div>

  <!-- Row 2: Run Controls -->
  <div class="toolbar-row" id="run-row">
    <div class="run-left">
      <button id="run-macro-btn" class="btn-primary" title="Runs the current macro once or starts looping if enabled"></button>
      <label class="switch">
        <input type="checkbox" id="loop-mode-check">
        <span class="switch-track"></span>
        Loop mode
      </label>
    </div>
    <div class="run-right">
      <button id="record-btn" class="btn-record" title="Record keyboard and mouse events into the macro"></button>
    </div>
  </div>

  <!-- Empty state shown when no macro is selected -->
  <div id="no-macro-state" class="empty-state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>
    <p>No macro selected</p>
    <span>Choose a macro above, or create a new one to get started.</span>
  </div>

  <!-- Row 3: Macro Editor (hidden when no macro selected) -->
  <div id="macro-editor" class="hidden">
    <div class="editor-title-row">
      <label for="macro-title">Title</label>
      <input type="text" id="macro-title" placeholder="Macro name">
    </div>

    <div class="editor-content-area">
      <div class="canvas-scroll" id="canvas-scroll">
        <div class="canvas-sizer" id="canvas-sizer">
          <div class="canvas-inner" id="canvas-inner"></div>
        </div>
      </div>
      <button id="add-strand-btn" class="btn-icon canvas-add-strand" title="Add new instruction strand" aria-label="Add new instruction strand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>
      <div id="recording-overlay" class="recording-overlay hidden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="6" fill="currentColor"></circle></svg>
        <span>Recording…</span>
        <span class="recording-overlay-hint">Adding and removing instructions is disabled while recording.</span>
      </div>
    </div>

    <div class="editor-toolbar">
      <button id="undo-btn" title="Undo last instruction change"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20v-7a4 4 0 0 0-4-4H4"></path><path d="M9 14 4 9l5-5"></path></svg><span>Undo</span></button>
      <button id="redo-btn" title="Redo last undone change"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"></path><path d="M4 20v-7a4 4 0 0 1 4-4h12"></path></svg><span>Redo</span></button>
      <button id="clear-instructions-btn" class="btn-danger" title="Remove all instructions"></button>
      <button id="save-macro-btn" class="btn-primary" title="Save macro to disk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"></path><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"></path><path d="M7 3v4a1 1 0 0 0 1 1h7"></path></svg><span>Save macro</span></button>
    </div>
  </div>

</div>

<!-- ═══ Settings Page ═══════════════════════════════════════════════════════ -->
<div id="settings-page" class="page-hidden">
  <div class="settings-header">
    <button id="back-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg><span>Back</span></button>
    <span style="font-weight:600;">Settings</span>
    <button id="theme-toggle-btn" class="btn-icon" style="margin-left:auto;"></button>
  </div>
  <div class="settings-scroll">
    <div id="warnings-container"></div>

    <!-- Global Hotkeys -->
    <div class="settings-section">
      <div class="settings-section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"></path><path d="m21 2-9.6 9.6"></path><circle cx="7.5" cy="15.5" r="5.5"></circle></svg><span>Global Hotkeys</span></div>
      <div id="global-hotkeys-list"></div>
    </div>

    <!-- Per-Macro Hotkeys -->
    <div class="settings-section">
      <div class="settings-section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"></path><path d="m21 2-9.6 9.6"></path><circle cx="7.5" cy="15.5" r="5.5"></circle></svg><span>Per-Macro Hotkeys</span></div>
      <div id="per-macro-hotkeys-list"></div>
      <div class="settings-row" id="add-hotkey-form">
        <div class="settings-row-label">Add hotkey:</div>
        <div id="pending-macro-select-container"></div>
        <button id="pending-combo-btn" class="btn-chip">Set combo</button>
        <button id="add-macro-hotkey-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg><span>Add</span></button>
      </div>
    </div>

    <!-- TCP Server -->
    <div class="settings-section">
      <div class="settings-section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"></rect><rect width="20" height="8" x="2" y="14" rx="2" ry="2"></rect><line x1="6" x2="6.01" y1="6" y2="6"></line><line x1="6" x2="6.01" y1="18" y2="18"></line></svg><span>TCP Server</span></div>
      <div id="tcp-server-section"></div>
    </div>

    <!-- Updates (rendered always, hidden by JS if no update info) -->
    <div class="settings-section" id="updates-section">
      <div class="settings-section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></svg><span>Updates</span></div>
      <div id="updates-content"></div>
    </div>
  </div>
</div>

<div id="dd-portal"></div>
<script type="module" src="/src/app.js"></script>
</body>
</html>
